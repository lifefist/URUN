<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b0f1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="新药风云">
<title>新药风云 · 从靶点到上市 v3.6</title>
<style>
:root{
  --bg:#0b0f1a; --panel:#131a29; --panel2:#182033; --line:#26314a;
  --txt:#e8eefc; --dim:#8fa0c0; --ok:#3ddc97; --warn:#ffcf5c; --bad:#ff6b6b;
  --brand:#4f8cff; --brand2:#7c5cff;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--txt);overscroll-behavior-y:none;
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;
  background-image:radial-gradient(900px 460px at 12% -8%,#1b2744 0%,rgba(11,15,26,0) 62%);
  background-repeat:no-repeat;
}
#app{padding:calc(10px + var(--safe-t)) 12px calc(96px + var(--safe-b))}
h1{font-size:17px;margin:2px 0 10px;font-weight:700;letter-spacing:.4px;display:flex;align-items:center}
h1 .co{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-right:8px}
h1 .ver{flex:none;font-size:11px;color:var(--dim);font-weight:400;margin-right:8px}
h1 a{flex:none;font-size:12px;color:var(--brand);text-decoration:none;font-weight:400}
.bar{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.stat span{display:block;font-size:11px;color:var(--dim)}
.stat b{font-size:16px;font-variant-numeric:tabular-nums}
.stat.bad b{color:var(--bad)}
.stat.good b{color:var(--ok)}
.kpi{font-size:15px;color:#fff;font-variant-numeric:tabular-nums}
.pop{display:inline-block;animation:pop .5s ease-out}
@keyframes pop{0%{transform:scale(.55);opacity:.2}60%{transform:scale(1.16)}100%{transform:scale(1);opacity:1}}
.count{font-size:12px;color:var(--dim);margin:14px 2px 8px;display:flex;justify-content:space-between;gap:8px}
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.card.stalled{border-color:#5b4a1f;background:linear-gradient(180deg,#241d10,#1a1509)}
.card.over{border-color:#4f8cff;background:linear-gradient(180deg,#152344,#111a2f)}
.card.ahead{border-color:#2f7a5c;background:linear-gradient(180deg,#12251e,#101a17)}
.card.behind{border-color:#7a3a2f;background:linear-gradient(180deg,#271512,#1a100d)}
.card.tap{cursor:pointer}
.card .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.code{font-size:16px;font-weight:700}
.tag{display:inline-block;font-size:11px;padding:2px 7px;border-radius:999px;background:#22304d;color:#a9c4ff;margin-left:6px;vertical-align:middle;font-weight:400}
.badge{font-size:11px;padding:3px 8px;border-radius:999px;white-space:nowrap}
.badge.ok{background:#123326;color:var(--ok)}
.badge.warn{background:#33290f;color:var(--warn)}
.badge.rv{background:#3a1f1a;color:#ff9b7a}
.sub{font-size:12px;color:var(--dim);margin-top:5px}
.barline{height:8px;background:#0e1524;border-radius:6px;overflow:hidden;margin:9px 0 6px;border:1px solid #1d2740}
.barline i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand2))}
.vs{display:grid;grid-template-columns:36px 1fr 52px;gap:8px;align-items:center;margin-top:6px;font-size:11px;color:var(--dim)}
.vs .vs-bar{height:8px;background:#0e1524;border:1px solid #1d2740;border-radius:6px;overflow:hidden}
.vs .vs-bar i{display:block;height:100%;transition:width .45s ease}
.vs.me .vs-bar i{background:linear-gradient(90deg,#3ddc97,#2f9e6e)}
.vs.rv .vs-bar i{background:linear-gradient(90deg,#ff8a5c,#e0452f)}
.vs .vs-n{text-align:right;font-variant-numeric:tabular-nums}
.tiers{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:9px}
.tiers.three{grid-template-columns:repeat(3,1fr)}
.tiers button{min-height:44px;font-size:13px;border-radius:10px;background:transparent;color:var(--dim)}
.tiers button.on{border-color:var(--brand);background:#16305c;color:#cfe0ff;font-weight:700}
.row{display:flex;gap:8px;margin-top:8px}
.row button{flex:1}
button{font:inherit;color:var(--txt);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;touch-action:manipulation;cursor:pointer}
button:active{transform:scale(.99)}
button.primary{background:linear-gradient(180deg,#3f7bff,#2f5be0);border-color:#4f8cff;font-weight:700;color:#fff}
button.ghost{background:transparent;color:var(--dim)}
button:disabled{opacity:.45}
input[type=text]{font:inherit;color:var(--txt);background:#0e1524;border:1px solid var(--line);border-radius:12px;padding:11px 12px;width:100%;margin:6px 0 10px}
input[type=text]::placeholder{color:#5d6c88}
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.badge-i{background:#0e1524;border:1px solid #1d2740;border-radius:12px;padding:8px 4px;text-align:center;cursor:pointer}
.badge-i .ic{font-size:20px;display:block;line-height:1.35;filter:grayscale(1);opacity:.32}
.badge-i .nm{font-size:10px;color:var(--dim);display:block;margin-top:2px}
.badge-i.on{border-color:#3f7bff;background:#152344}
.badge-i.on .ic{filter:none;opacity:1}
.badge-i.on .nm{color:#cfe0ff}
#log{background:#0d1424;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.6;height:96px;overflow:hidden;color:#bdcbe6}
#log.folded{height:42px;overflow:hidden;color:var(--dim)}
#log p{margin:0 0 4px}
#log .g{color:var(--ok)} #log .r{color:var(--bad)} #log .y{color:var(--warn)}
footer{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;
  padding:8px 12px calc(8px + var(--safe-b));background:rgba(11,15,26,.93);backdrop-filter:blur(10px);border-top:1px solid var(--line)}
footer .primary{grid-column:1 / -1;min-height:48px;font-size:16px}
footer button{min-height:44px;font-size:14px}
.modal{position:fixed;inset:0;z-index:50;background:rgba(4,7,14,.72);display:flex;align-items:flex-end;justify-content:center}
.modal.hidden{display:none}
.sheet{width:100%;max-height:88dvh;overflow:auto;background:var(--panel);border:1px solid var(--line);
  border-radius:16px 16px 0 0;padding:14px 14px calc(18px + var(--safe-b));-webkit-overflow-scrolling:touch}
.sheet h2{font-size:16px;margin:0 0 8px}
.opt{border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px;background:#111a2b}
.opt.on{border-color:var(--brand);background:#16305c}
@media(min-width:760px){
  #app{max-width:820px;margin:0 auto;padding-bottom:24px}
  .bar{grid-template-columns:repeat(4,1fr)}
  footer{left:50%;transform:translateX(-50%);width:100%;max-width:820px;grid-template-columns:2fr 1fr 1fr 1fr;border-radius:14px 14px 0 0}
  footer .primary{grid-column:auto}
  .modal{align-items:center}
  .sheet{max-width:560px;border-radius:16px;max-height:82vh}
  #log{height:170px}
}
</style>
</head>

<div id="app">
  <h1><span class="co" id="s-co">新药风云</span><span class="ver" id="s-ver">v3.6</span><a href="javascript:openRules()">玩法说明</a></h1>

<script>
/* ========== 小工具 ========== */
const $ = s => document.querySelector(s);
const rnd = n => Math.floor(Math.random() * n);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const f2 = v => (v < 0 ? '-' : '') + Math.abs(v).toFixed(2);
const num = n => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
const stars = n => '★'.repeat(n) + '☆'.repeat(3 - n);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fmtSec(sec){
  sec = Math.max(0, Math.round(sec || 0));
  if (sec < 60) return sec + ' 秒';
  const m = Math.floor(sec / 60), s = sec % 60;
  return m + ' 分' + (s ? s + ' 秒' : '');
}
function pctOf(d, base){
  if (!base) return '';
  const p = d / Math.abs(base) * 100;
  return '(' + (p >= 0 ? '+' : '') + p.toFixed(1) + '%)';
}
/* 数字滚动 */
function rollTo(el, to, fmt, from){
  if (!el) return;
  const has = (typeof el.__cur === 'number');
  const start = (from === undefined) ? (has ? el.__cur : to) : from;
  if (!window.requestAnimationFrame || Math.abs(start - to) < 1e-9){
    el.__cur = to; el.textContent = fmt(to); return;
  }
  if (el.__raf) cancelAnimationFrame(el.__raf);
  const t0 = performance.now(), dur = 520;
  const step = now => {
    const k = Math.min(1, (now - t0) / dur);
    const e = 1 - Math.pow(1 - k, 3);
    const v = start + (to - start) * e;
    el.__cur = v; el.textContent = fmt(v);
    if (k < 1){ el.__raf = requestAnimationFrame(step); }
    else { el.__raf = null; el.__cur = to; el.textContent = fmt(to); }
  };
  el.__raf = requestAnimationFrame(step);
}
function animateSheet(){
  document.querySelectorAll('#sheet [data-n]').forEach(el => {
    const to = parseFloat(el.getAttribute('data-n')) || 0;
    const k = el.getAttribute('data-k');
    if (k === 'int') rollTo(el, to, v => num(Math.round(v)), 0);
    else if (k === 'rank') rollTo(el, to, v => '全球药企第 ' + Math.round(v) + ' 位', 999);
    else rollTo(el, to, v => f2(v), 0);
  });
}
/* ========== 累计数据（跨局） ========== */
const KEY = 'pharma_v3_save';
const SKEY = 'pharma_v3_stats';
const RKEY = 'pharma_v3_ranks';
let STATS = {clicks:0, games:0, badges:[], legacy:0, perk:{}};
function loadStats(){
  try{
    const o = JSON.parse(localStorage.getItem(SKEY) || '{}') || {};
    STATS = {
      clicks: Number(o.clicks) || 0,
      games:  Number(o.games) || 0,
      badges: Array.isArray(o.badges) ? o.badges : [],
      legacy: Number(o.legacy) || 0,
      perk: (o.perk && typeof o.perk === 'object') ? o.perk : {}
    };
  }catch(e){ STATS = {clicks:0, games:0, badges:[], legacy:0, perk:{}}; }
}
function saveStats(){ try{ localStorage.setItem(SKEY, JSON.stringify(STATS)); }catch(e){} }
loadStats();
/* ========== 配置表 ========== */
const MAX_Q = 40, IND_COST_INIT = 0.5, RETRY_COST = 1.2, MAX_TEAM = 5;
const DIFFS = {
  easy:  {k:'easy',  n:'新手', pass: 0.08, cash:10, evt:0.30},
  normal:{k:'normal',n:'标准', pass: 0.00, cash:8,  evt:0.40},
  hard:  {k:'hard',  n:'硬核', pass:-0.07, cash:6,  evt:0.55}
};
const INDS = [
  {id:'onco', n:'晚期实体瘤',        coef:0.55, peak:62, cost:1.35},
  {id:'ad',   n:'阿尔茨海默病',      coef:0.62, peak:55, cost:1.30},
  {id:'rare', n:'罕见病（基因治疗）', coef:0.72, peak:26, cost:1.40},
  {id:'ra',   n:'自身免疫（类风湿）', coef:0.95, peak:40, cost:1.10},
  {id:'dm',   n:'2 型糖尿病',        coef:1.15, peak:34, cost:0.95},
  {id:'cv',   n:'高血脂/心血管',      coef:1.25, peak:30, cost:0.90},
  {id:'flu',  n:'流感抗病毒',        coef:1.38, peak:18, cost:0.85},
  {id:'hz',   n:'带状疱疹疫苗',      coef:1.70, peak:22, cost:0.80}
];
const STAGES = [
  {n:'靶点发现',   base:0.51, need:2, cost:0.12, clinical:false},
  {n:'先导优化',   base:0.66, need:3, cost:0.18, clinical:false},
  {n:'临床前研究', base:0.69, need:2, cost:0.22, clinical:false},
  {n:'IND 申报',   base:0.86, need:1, cost:0.12, clinical:false},
  {n:'I 期临床',   base:0.62, need:2, cost:0.30, clinical:true},
  {n:'II 期临床',  base:0.36, need:3, cost:0.45, clinical:true},
  {n:'III 期临床', base:0.56, need:4, cost:0.85, clinical:true},
  {n:'NDA 审批',   base:0.91, need:2, cost:0.28, clinical:false},
  {n:'上市销售',   base:1.00, need:0, cost:0.00, clinical:false}
];
const TIERS = [
  {k:'pause', n:'暂停',  c:0,   s:0,   p:0},
  {k:'low',   n:'低投入', c:0.6, s:0.7, p:-0.04},
  {k:'mid',   n:'中投入', c:1,   s:1,   p:0},
  {k:'high',  n:'高投入', c:1.9, s:1.5, p:0.06}
];
const tierOf = k => TIERS.find(t => t.k === k);
const SALES = [
  {k:'low',  n:'低销售', rate:0.12, def:0.000},
  {k:'mid',  n:'中销售', rate:0.20, def:0.010},
  {k:'high', n:'高销售', rate:0.30, def:0.022}
];
const salesOf = k => SALES.find(t => t.k === k) || SALES[1];
const SHARE_DECAY = 0.012;
const MODALS = [
  {n:'小分子',    pre:'SM'},  {n:'单克隆抗体', pre:'mAb'}, {n:'双特异性抗体', pre:'BsAb'},
  {n:'ADC',      pre:'ADC'}, {n:'融合蛋白',   pre:'FP'},  {n:'siRNA', pre:'si'},
  {n:'mRNA 疫苗', pre:'mR'},  {n:'细胞治疗',   pre:'CT'}
];
const TARGETS = ['PD-1','EGFR','KRAS G12C','TIGIT','CLDN18.2','IL-6R','PCSK9','GLP-1R',
                 'BACE1','SGLT2','Aβ 蛋白','LAG-3','CD19','Tau 蛋白','C5 补体','VEGF-A'];
const FIN_ROUNDS = [{amt:3.0,eq:0.10},{amt:2.5,eq:0.12},{amt:2.0,eq:0.15},{amt:1.5,eq:0.20}];
const GRADES = [
  {min:60,   tier:'S', rank:'传奇药企'},
  {min:30,   tier:'A', rank:'卓越生科'},
  {min:15,   tier:'B', rank:'优秀 Biotech'},
  {min:6,    tier:'C', rank:'稳健经营'},
  {min:0,    tier:'D', rank:'勉强存活'},
  {min:-1e9, tier:'E', rank:'资不抵债'}
];
const ORDER = ['E','D','C','B','A','S'];
const gradeOf = net => GRADES.find(g => net >= g.min) || GRADES[GRADES.length - 1];
function rankPos(net){
  if (!(net > 0)) return null;
  return clamp(Math.round(1200 / Math.pow(1 + net / 2, 1.3)), 1, 999);
}
/* 竞争对手名字池 */
const RIVAL_PRE = ['巨擎','鲲鹏','恒昱','赤霄','辰曜','博莱','安捷','纽特','泰和','万钧','启明','承光','沧澜','曜石'];
const RIVAL_SUF = ['制药','生物','医药','生科','药业','生物技术'];
/* ========== 成就徽章 ========== */
const BADGES = [
  {k:'first_go', i:'🌱', n:'初次立项', d:'完成第一次立项'},
  {k:'launch1',  i:'🎉', n:'首次上市', d:'第一个产品获批上市'},
  {k:'fast12',   i:'⚡', n:'闪电上市', d:'单局第 12 个季度前就有产品上市'},
  {k:'perfect',  i:'🧪', n:'一次通关', d:'单个项目全程零失败判定并上市'},
  {k:'streak5',  i:'🔥', n:'火热状态', d:'连续 5 次阶段判定通过'},
  {k:'cash20',   i:'💰', n:'现金大户', d:'单局现金达到 20 亿'},
  {k:'top100',   i:'🏆', n:'跻身百强', d:'全球药企名次进入前 100 位'},
  {k:'gradeS',   i:'👑', n:'传奇药企', d:'单局获得 S 级评级'},
  {k:'up3',      i:'📈', n:'连涨三局', d:'连续 3 局收益正增长'},
  {k:'click1k',  i:'🖱', n:'指尖千次', d:'累计点击达到 1000 次'},
  {k:'launch3',  i:'🧬', n:'管线丰富', d:'单局上市 3 个产品'},
  {k:'rescue',   i:'🛟', n:'科研韧性', d:'复议成功挽救一个项目'},
  {k:'game10',   i:'🌍', n:'行业老兵', d:'累计玩满 10 局'},
  {k:'best1',    i:'🥇', n:'刷新纪录', d:'刷新本机历史榜最好成绩'},
  {k:'first_in', i:'🏁', n:'首创新药', d:'抢先于竞争对手在同一适应症上市'},
  {k:'beat_rv',  i:'⚔️', n:'正面对抗', d:'单局上市产品数不少于竞争对手'},
  {k:'ahead',    i:'🚀', n:'保持领先', d:'结算时你的最快项目阶段不低于对手'}
];
const BHAVE = k => (STATS.badges || []).indexOf(k) >= 0;
function unlock(k){
  STATS.badges = STATS.badges || [];
  if (STATS.badges.indexOf(k) >= 0) return false;
  STATS.badges.push(k); saveStats();
  const b = BADGES.find(x => x.k === k);
  if (b && S){
    if (S.over){
      S.newBadges = S.newBadges || [];
      if (S.newBadges.indexOf(b.n) < 0) S.newBadges.push(b.n);
    } else {
      log('🏅 解锁成就【' + b.n + '】：' + b.d, 'y');
    }
  }
  return true;
}
function scanBadges(){
  if (!S) return;
  const r = S.result || {};
  const t = {
    first_go: S.projects.length > 0 || S.launched > 0 || S.fails > 0,
    launch1:  S.launched >= 1,
    fast12:   S.firstQ > 0 && S.firstQ <= 12,
    perfect:  !!S.perfect,
    streak5:  (S.okStreak || 0) >= 5,
    cash20:   S.cash >= 20,
    top100:   r.pos != null && r.pos <= 100,
    gradeS:   !!S.over && r.tier === 'S',
    click1k:  STATS.clicks >= 1000,
    launch3:  S.launched >= 3,
    rescue:   !!S.rescued,
    game10:   STATS.games >= 10,
    best1:    !!r.isRecord,
    first_in: (S.firstIn || 0) >= 1,
    beat_rv:  !!S.over && !!S.rival && S.launched > 0 && S.launched >= S.rival.launched,
    ahead:    !!S.over && !!S.rival && myStage() >= rivalStage()
  };
  Object.keys(t).forEach(k => { if (t[k]) unlock(k); });
  if (S.newBadges && S.newBadges.length && S.result) S.result.newBadges = S.newBadges.slice();
}
function badgesHTML(){
  const own = STATS.badges || [];
  return '<div class="badges">' + BADGES.map(b =>
      '<div class="badge-i ' + (own.indexOf(b.k) >= 0 ? 'on' : '') + '" onclick="badgeInfo(\'' + b.k + '\')">'
      + '<span class="ic">' + b.i + '</span><span class="nm">' + b.n + '</span></div>').join('')
    + '</div><div class="sub">已解锁 ' + own.length + '/' + BADGES.length + ' · 点一下徽章可看解锁条件</div>';
}
function badgeInfo(k){

function buyPerk(k){
  const p = PERKS.find(x => x.k === k);

function stName(i){

  if (i > 7) return '已上市销售';

function genRivalProj(r){
  const mine = S.projects.filter(p => p.status !== 'launched').map(p => p.ind);
  let ind;
  if (mine.length && Math.random() < 0.45) ind = mine[rnd(mine.length)];
  else ind = INDS[rnd(INDS.length)];
  const m = MODALS[rnd(MODALS.length)];
  return {code: m.pre + '-' + (1000 + rnd(9000)), mod: m.n, ind,
          stage: 0, progress: 0, speed: r.speed * (0.92 + Math.random() * 0.20)};
}
function genRival(){
  const tune = ({easy:{sp:0.92,lk:0.95}, normal:{sp:1.06,lk:1.00}, hard:{sp:1.20,lk:1.05}}[S.diff.k])
             || {sp:1.06,lk:1.00};
  const r = {
    name: RIVAL_PRE[rnd(RIVAL_PRE.length)] + RIVAL_SUF[rnd(RIVAL_SUF.length)],
    speed: tune.sp + Math.min(0.14, (STATS.legacy || 0) * 0.01),
    luck: tune.lk,
    launched: 0, launchedInds: [], lastGap: null, proj: null
  };
  r.proj = genRivalProj(r);
  return r;
}
function rivalStage(){
  if (!S.rival || !S.rival.proj) return 8;
  return S.rival.proj.stage;
}
function myStage(){
  let s = -1;
  S.projects.forEach(p => { if (p.status !== 'launched') s = Math.max(s, p.stage); });
  if (S.marketed.length) s = Math.max(s, 8);
  return s;
}
function rivalStep(L){
  const r = S.rival;
  if (!r || !r.proj) return;
  const p = r.proj, st = STAGES[p.stage];
  p.progress += p.speed * (0.82 + Math.random() * 0.42);
  if (p.progress < (st.need || 1)) return;
  p.progress = 0;
  const rate = clamp(st.base * p.ind.coef * r.luck, 0.05, 0.96);
  if (Math.random() * 100 <= rate * 100){
    p.stage++;
    if (p.stage >= 8){
      const ind = p.ind;
      r.launched++; r.launchedInds.push(ind.id);
      L.push('⚔️ 竞品快讯：' + r.name + ' 的 ' + p.code + ' 在「' + ind.n + '」获批上市（对手第 ' + r.launched + ' 个产品）。', 'r');
      S.marketed.forEach(m => {
        if (m.indId === ind.id && m.comp < 4){
          m.comp++; m.share = clamp(m.share * 0.92, 0.25, 1.10);
          L.push('竞品 ' + p.code + ' 与你已上市的 ' + m.name + ' 短兵相接：竞品威胁 +1、份额 -8%。', 'r');
        }
      });
      r.proj = genRivalProj(r);
    } else if (p.stage >= 4 && p.stage <= 6){
      L.push('⚔️ 竞品快讯：' + r.name + ' 的 ' + p.code + ' 推进到 ' + STAGES[p.stage].n + '。');
    }
  } else if (st.clinical && Math.random() < 0.5){
    L.push('⚔️ 竞品快讯：' + r.name + ' 的 ' + p.code + ' 在 ' + st.n + ' 折戟，转身推进备选分子。', 'g');
    r.proj = genRivalProj(r);
  } else {
    L.push('⚔️ 竞品快讯：' + r.name + ' 的 ' + p.code + ' 在 ' + st.n + ' 未达终点，方案回炉。');
  }
}
function gapCheck(L){
  const r = S.rival;
  if (!r) return;
  if (S.marketed.length > 0 || r.launched > 0) return;   /* 只在首次上市竞赛期播报 */
  const ms = myStage(), rs = rivalStage();
  if (ms < 0) return;
  const gap = ms - rs;
  if (r.lastGap != null){
    if (r.lastGap < 0 && gap >= 0)
      L.push('⚡ 反超！你的最快项目已在阶段上追平 ' + r.name + '（当前 ' + stName(ms) + '）。', 'g');
    else if (r.lastGap >= 0 && gap < 0)
      L.push('⚠️ ' + r.name + ' 重新领先你 ' + (-gap) + ' 个阶段（对手在 ' + stName(rs) + '）。', 'y');
  }
  r.lastGap = gap;
}

function saveRank(res){
  try{
    const list = loadRanks();
    const byTs = list.slice().sort((a, b) => a.ts - b.ts);
    const prev = byTs[byTs.length - 1] || null;
    const first = byTs[0] || null;
    const best = list.slice().sort((a, b) => b.net - a.net)[0] || null;
    res.isRecord = !best || res.net > best.net + 0.005;
    const fasts = list.filter(x => x.firstQ > 0);
    const fast = fasts.length ? Math.min.apply(null, fasts.map(x => x.firstQ)) : 0;
    let streak = 1, last = res.net;
    for (let i = byTs.length - 1; i >= 0; i--){
      if (last > byTs[i].net){ streak++; last = byTs[i].net; } else break;
    }
    res.cmp = {
      games: list.length + 1,
      hasPrev: !!prev,
      prevNet: prev ? prev.net : null,
      prevPos: prev ? prev.pos : null,
      prevTier: prev ? prev.tier : null,
      prevFirstQ: prev ? prev.firstQ : 0,
      prevCo: prev ? prev.co : '',
      bestNet: best ? best.net : null,
      firstNet: first ? first.net : null,
      fastQ: fast,
      streak: streak
    };
    list.push({net: res.net, rank: res.rank, tier: res.tier, pos: res.pos,
               diff: S.diff.n, co: S.co || '',
               rival: S.rival ? S.rival.name : '',
               rvWin: S.rival ? (S.launched > 0 && S.launched >= S.rival.launched) : false,
               launched: S.launched, q: res.q || S.q,
               firstQ: res.firstQ || 0, clicks: res.clicks || 0, sec: res.sec || 0,
               ts: Date.now()});
    list.sort((a, b) => b.net - a.net);
    localStorage.setItem(RKEY, JSON.stringify(list.slice(0, 20)));
    STATS.games++; saveStats();
    if (res.cmp.streak >= 3) unlock('up3');
    if (res.isRecord) unlock('best1');
  }catch(e){}
}

function confirmProject(){

  if (S.rival && S.rival.proj.ind.id === ind.id)

/* ========== 操作：档位 / 复议 / 终止 ========== */
function setTier(id, k){
  const p = S.projects.find(x => x.id === id);
  if (!p || p.status !== 'active') return;
  p.tier = k; render();
}
function kill(id){
  const p = S.projects.find(x => x.id === id);
  if (!p) return;
  S.projects = S.projects.filter(x => x !== p);
  S.fails++; updateExp(); S.okStreak = 0;
  log('主动终止 ' + pn(p) + '。累计失败经验，后续项目通过率提升。', 'r');
  render();
}
function retry(id){
  const p = S.projects.find(x => x.id === id);
  if (!p || p.status !== 'stalled') return;
  if (S.cash < RETRY_COST){ toast('现金不足 ' + RETRY_COST + ' 亿，无法支付复议费用。'); return; }
  S.cash -= RETRY_COST; p.retryUsed = true;
  const st = STAGES[p.stage];
  const rate = clamp(estRate(p, true) * 0.85, 0.03, 0.95);
  const roll = Math.random() * 100, pass = roll <= rate * 100;
  log('补充数据复议：' + pn(p) + ' ' + st.n + ' 通过率 ' + (rate * 100).toFixed(0)
      + '%，掷出 ' + roll.toFixed(1) + ' → ' + (pass ? '通过 ✅' : '失败 ❌'), pass ? 'g' : 'r');
  if (pass){
    S.rescued = true;
    p.status = 'active'; p.stall = 0; p.progress = 0;
    advance(p);
  } else {
    S.projects = S.projects.filter(x => x !== p); S.fails++; updateExp(); S.okStreak = 0;
    log(pn(p) + ' 复议失败，项目终止。', 'r');
  }
  render();
}

  const L = [];

  if (Math.random() < S.diff.evt) L.push('【事件】' + fireEvent());
  let gross = 0, sga = 0;
  S.marketed.forEach(m => {
    m.q++;
    if (m.comp < 4 && Math.random() < 0.26) m.comp++;
    if (m.comp >= 3 && !m.c3){ m.c3 = true; m.share *= 0.78; L.push('竞品获批上市：' + m.name + ' 市场份额承压（-22%）。'); }
    if (m.comp >= 4 && !m.c4){ m.c4 = true; m.share *= 0.85; L.push('第二个竞品进入：' + m.name + ' 份额再降 15%。'); }
    const t = salesOf(m.tier);
    m.share = clamp(m.share - SHARE_DECAY + t.def, 0.25, 1.10);
    let rev = m.peak / 4 * Math.min(1, m.q / 8) * m.share * S.mods.rev;
    if (m.q > 32) rev *= 0.4;
    const sg = rev * t.rate;
    m.lastGross = rev; m.lastSg = sg; m.lastRev = rev - sg;
    gross += rev; sga += sg;
  });
  const income = gross - sga;
  if (gross > 0){
    S.cash += income;
    L.push('上市产品净回款 +' + f2(income) + ' 亿（毛收入 ' + f2(gross) + '，销售费用 ' + f2(sga) + '）。');
  }
  const salary = 0.06 * S.team;
  S.cash -= salary;
  L.push('团队 Lv' + S.team + ' 薪资 -' + f2(salary) + ' 亿。');
  const dead = [];
  S.projects.forEach(p => {
    if (p.status === 'stalled'){
      p.stall--;
      if (p.stall <= 0){
        dead.push(p); S.fails++; S.okStreak = 0;
        L.push(pn(p) + ' 复议窗口关闭，项目终止，积累失败经验。');
      } else {
        L.push(pn(p) + ' 仍在暂缓待决（剩余 ' + p.stall + ' 个季度决策窗口）。');
      }
      return;
    }
    const st = STAGES[p.stage], t = tierOf(p.tier);
    if (t.c === 0){ L.push(pn(p) + '（' + st.n + '）本季度暂停，进度冻结。'); return; }
    const spend = st.cost * t.c * p.cand.cost * p.ind.cost * S.mods.cost;
    S.cash -= spend; p.spend += spend;
    p.progress += t.s * teamSpeed() * S.mods.speed;
    L.push(pn(p) + '（' + st.n + '）投入 ' + f2(spend) + ' 亿，阶段进度 '
         + Math.min(100, Math.round(p.progress / (st.need || 1) * 100)) + '%。');
    if (p.progress >= st.need){
      const rate = clamp(estRate(p, true), 0.03, 0.95);
      const roll = Math.random() * 100;
      if (roll <= rate * 100){
        S.okStreak = (S.okStreak || 0) + 1;
        L.push('🎲 ' + pn(p) + ' ' + st.n + ' 判定：通过率 ' + (rate * 100).toFixed(0)
               + '%，掷出 ' + roll.toFixed(1) + ' → 通过 ✅');
        if (S.okStreak >= 2)
          L.push('🔥 连续第 ' + S.okStreak + ' 次判定通过，团队状态火热。', 'g');
        advance(p);
      } else {
        S.okStreak = 0; p.failed = true;
        if (st.clinical && !p.retryUsed){
          p.status = 'stalled'; p.stall = 4;
          L.push('🎲 ' + pn(p) + ' ' + st.n + ' 判定：通过率 ' + (rate * 100).toFixed(0)
                 + '%，掷出 ' + roll.toFixed(1) + ' → 失败 ❌', 'r');
          L.push(pn(p) + ' 进入「暂缓待决」：可付 ' + RETRY_COST + ' 亿补充数据复议一次（成功率 ×0.85），4 个季度后自动终止。', 'y');
        } else {
          dead.push(p); S.fails++;
          L.push('🎲 ' + pn(p) + ' ' + st.n + ' 判定：通过率 ' + (rate * 100).toFixed(0)
                 + '%，掷出 ' + roll.toFixed(1) + ' → 失败 ❌', 'r');
          L.push(pn(p) + ' 项目终止，公司积累一次失败经验（后续通过率 +3%）。', 'r');
        }
      }
    }
  });
  S.projects = S.projects.filter(p => dead.indexOf(p) < 0);
  updateExp();
  /* 竞争对手同步推进 */
  rivalStep(L);
  gapCheck(L);
  S.q++;
  if (S.cash < 0) return gameOver('资金链断裂，公司进入清算程序。');
  if (S.q > MAX_Q) return gameOver('十年之期已到，公司进入期末结算。');
  L.reverse().forEach(x => {
    const msg = (typeof x === 'string') ? x : x.t;
    const forced = (typeof x === 'string') ? '' : x.cls;
    const cls = forced || ((msg.indexOf('❌') >= 0 || msg.indexOf('终止') >= 0 || msg.indexOf('落后') >= 0) ? 'r'
              : (msg.indexOf('🎉') >= 0 || msg.indexOf('✅') >= 0 || msg.indexOf('经验') >= 0
                 || msg.indexOf('领先') >= 0 || msg.indexOf('反超') >= 0) ? 'g' : '');
    log(msg, cls);
  });
  render();
}
function advance(p){
  p.stage++; p.progress = 0;
  if (p.stage >= 8){
    let peak = p.ind.peak * (0.85 + Math.random() * 0.3);
    const ind = p.ind;
    const rv = S.rival;
    if (rv && rv.proj && rv.proj.ind.id === ind.id && rv.proj.stage < 8){
      S.firstIn = (S.firstIn || 0) + 1;
      peak *= 1.08;
      log('🏁 抢先上市！你的产品先于 ' + rv.name + ' 在「' + ind.n + '」获批，首创新药溢价 +8%。', 'g');
    } else if (rv && rv.launchedInds.indexOf(ind.id) >= 0){
      peak *= 0.82;
      log('⚠️ 「' + ind.n + '」已被 ' + rv.name + ' 抢得先机，本产品按 me-too 定价（峰值 -18%）。', 'y');
    }
    const nm = p.name || p.cand.code;
    S.marketed.push({id:'m' + (UID++), name:nm, ind:ind.n, indId:ind.id, peak, q:0,
                     share:1, tier:'mid', comp:0, c3:false, c4:false,
                     lastRev:0, lastGross:0, lastSg:0});
    S.launched++; p.status = 'launched';
    if (!p.failed) S.perfect = true;
    if (!S.firstQ) S.firstQ = S.q;
    log('🎉 ' + (p.name ? '「' + esc(p.name) + '」（' + p.cand.code + '）' : p.cand.code)
        + ' 获批上市！适应症 ' + ind.n + '，峰值年收入预期 ' + peak.toFixed(1)
        + ' 亿。上市后记得在上市卡上选销售投入档位——不投就等着竞品抢份额。', 'g');
  } else {
    log(pn(p) + ' 通过，进入「' + STAGES[p.stage].n + '」。', 'g');
  }
  updateExp();
}
function fireEvent(){
  const act = S.projects.filter(p => p.status === 'active');
  const pool = [
    () => { S.mods.pass += 0.06; return '监管窗口利好：本季度所有阶段通过率 +6%。'; },
    () => { S.mods.cost *= 1.30; return 'CRO 涨价：本季度研发支出 +30%。'; },
    () => { S.mods.cost *= 0.80; return '原料议价成功：本季度研发支出 -20%。'; },
    () => { S.mods.speed *= 1.25; return '团队状态极佳：本季度项目进度 +25%。'; },
    () => { S.cash += 0.80; return '学术大会数据亮眼，收到 BD 合作意向金 +0.80 亿。'; },
    () => { S.cash -= 0.50; return 'GMP 飞行检查发现偏差，罚款 -0.50 亿。'; },
    () => { S.cash -= 0.40; return '实验室设备故障，维修支出 -0.40 亿。'; }
  ];
  if (act.length) pool.push(() => {
    const p = act[rnd(act.length)];
    p.progress = Math.max(0, p.progress - 0.5);
    return '核心研究员离职：' + pn(p) + ' 阶段进度回退 0.5 个季度。';
  });
  if (S.marketed.length) pool.push(() => { S.mods.rev *= 1.25; return '医保谈判成功：本季度上市产品毛收入 +25%。'; });
  if (S.marketed.length) pool.push(() => { S.mods.rev *= 0.70; return '集采与专利挑战压力：本季度上市产品毛收入 -30%。'; });
  if (S.marketed.length) pool.push(() => {
    const m = S.marketed[rnd(S.marketed.length)];
    m.peak *= 0.85; return '临床数据被竞品超越：' + m.name + ' 峰值收入预期下调 15%。';
  });
  if (S.marketed.length) pool.push(() => {
    const m = S.marketed[rnd(S.marketed.length)];
    m.comp = Math.min(4, m.comp + 1);
    return '竞品进入审评加速通道：' + m.name + ' 竞品威胁 +1。';
  });
  return pool[rnd(pool.length)]();
}

const LEGACY_GAIN = {E:1, D:1, C:2, B:3, A:5, S:8};
function gameOver(reason){
  S.over = true;
  S.overReason = reason;
  const pipe = S.projects.reduce((a, p) => a + p.ind.peak * 0.5 * (p.stage / 8), 0);
  const mkt  = S.marketed.reduce((a, m) => a + m.peak * m.share * 1.2 * (m.q > 32 ? 0.5 : 1), 0);
  const gross = S.cash + pipe + mkt;
  const net = gross * (1 - S.equity);
  const g = gradeOf(net);
  const pos = rankPos(net);
  const sec = Math.max(0, Math.round((Date.now() - (S.t0 || Date.now())) / 1000));
  S.result = {gross, net, rank: g.rank, tier: g.tier, pos,
              cash: S.cash, mkt, pipe, equity: S.equity,
              launched: S.launched, fails: S.fails, team: S.team, exp: S.exp,
              q: S.q, firstQ: S.firstQ || 0, clicks: S.clicks || 0, sec: sec};
  if (!S.recorded){
    S.recorded = true;
    saveRank(S.result);
    S.gainLegacy = LEGACY_GAIN[g.tier] || 1;
    STATS.legacy = (STATS.legacy || 0) + S.gainLegacy;
    saveStats();
  }
  render();
  sheetHTML(resultSheet());
}

    g.fillStyle = '#0b0f1a'; g.fillRect(0, 0, 512, 512);
    const grd = g.createLinearGradient(0, 0, 512, 512);
    grd.addColorStop(0, '#4f8cff'); grd.addColorStop(1, '#7c5cff');
    g.fillStyle = grd; g.beginPath(); g.arc(256, 256, 196, 0, Math.PI * 2); g.fill();
    g.fillStyle = '#fff'; g.font = 'bold 250px sans-serif';
    g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('药', 256, 272);
    const icon = c.toDataURL('image/png');
    const al = document.createElement('link'); al.rel = 'apple-touch-icon'; al.href = icon;
    document.head.appendChild(al);
    const mf = {name:'新药风云 · 从靶点到上市', short_name:'新药风云', start_url:'./',
      scope:'./', display:'standalone', orientation:'portrait',
      background_color:'#0b0f1a', theme_color:'#0b0f1a',
      icons:[{src:icon, sizes:'512x512', type:'image/png', purpose:'any maskable'}]};
    const blob = new Blob([JSON.stringify(mf)], {type:'application/manifest+json'});
    const ml = document.createElement('link'); ml.rel = 'manifest'; ml.href = URL.createObjectURL(blob);
    document.head.appendChild(ml);
  }catch(e){}
}
/* ========== 启动 ========== */
function boot(){
  initPWA();
  loadStats();
  TMP.co = '';
  const s = load();
  if (s){
    S = s;
    const now = Date.now();
    const away = Math.max(0, (now - (S.lastSeen || now)) / 1000);
    S.t0 = now;
    if (!S.rival) S.rival = genRival();          /* 老存档补一个对手 */
    if (!Array.isArray(S.rival.launchedInds)) S.rival.launchedInds = [];
    if (S.rival.lastGap === undefined) S.rival.lastGap = null;
    if (!S.rival.proj) S.rival.proj = genRivalProj(S.rival);
    if (S.firstIn == null) S.firstIn = 0;
    const lab = clamp(Math.floor(away / 600), 0, 18);
    if (!S.over && lab > 0){
      S.pendingLab = (S.pendingLab || 0) + lab;
      S.lastLabAway = away;
    } else if (S.over){
      S.pendingLab = 0;
    }
    render();
    if (S.over && S.result){
      sheetHTML(resultSheet());
    } else if (S.pendingLab > 0){
      sheetHTML(labSheet());
    } else {
      const y = Math.floor((S.q - 1) / 4) + 1, qi = (S.q - 1) % 4 + 1;
      sheetHTML('<h2>欢迎回来，「' + esc(S.co) + '」</h2>'
        + '<div class="sub">进度：第 ' + y + ' 年 Q' + qi + ' · 现金 ' + f2(S.cash)
        + ' 亿 · 已上市 ' + S.launched + ' 个产品。</div>'
        + (S.rival ? '<div class="sub">⚔️ ' + esc(S.rival.name) + ' 当前在 ' + S.rival.proj.ind.n
            + ' 方向处于 ' + stName(S.rival.proj.stage) + '，已上市 ' + S.rival.launched + ' 个。</div>' : '')
        + '<div class="sub">你已玩 ' + STATS.games + ' 局 · 累计点击 ' + num(STATS.clicks)
        + ' 次 · 成就 ' + (STATS.badges || []).length + '/' + BADGES.length
        + ' · 传承点 ' + (STATS.legacy || 0) + '</div>'
        + '<div class="row"><button class="primary" onclick="closeSheet()">继续经营</button>'
        + '<button class="ghost" onclick="restart()">成立新公司</button></div>');
    }
  } else {
    startSheet();
  }
}
boot();
</script>
